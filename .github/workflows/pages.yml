name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Only fire when something that actually affects the build changes —
    # README/DAD/CLAUDE edits and test-only commits don't churn Pages.
    # workflow_dispatch below is the manual escape hatch if a deploy is
    # ever needed regardless.
    paths:
      - 'src/**'
      - '!src/**/__tests__/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.mjs'
      - 'config/default.json'
      - 'lib/config-loader.js'
      - '!lib/__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build for Pages subpath
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
