# WinnieOS kiosk keyboard boundary. Included only by the dedicated kiosk config.
# Keep text entry and Ctrl+A/C/V/X/Z/Y, word movement, and deletion available.
# Intercept browser commands before Chromium receives them (including iframes).
bindsym --no-repeat Control+n nop
bindsym --no-repeat Control+Shift+n nop
bindsym --no-repeat Control+t nop
bindsym --no-repeat Control+Shift+t nop
bindsym --no-repeat Control+l nop
bindsym --no-repeat Control+Shift+l nop
bindsym --no-repeat Control+k nop
bindsym --no-repeat Control+Shift+k nop
bindsym --no-repeat Control+e nop
bindsym --no-repeat Control+Shift+e nop
bindsym --no-repeat Control+o nop
bindsym --no-repeat Control+Shift+o nop
bindsym --no-repeat Control+p nop
bindsym --no-repeat Control+Shift+p nop
bindsym --no-repeat Control+h nop
bindsym --no-repeat Control+Shift+h nop
bindsym --no-repeat Control+j nop
bindsym --no-repeat Control+Shift+j nop
bindsym --no-repeat Control+u nop
bindsym --no-repeat Control+Shift+u nop
bindsym --no-repeat Control+d nop
bindsym --no-repeat Control+Shift+d nop
bindsym --no-repeat Control+s nop
bindsym --no-repeat Control+Shift+s nop
bindsym --no-repeat Control+b nop
bindsym --no-repeat Control+Shift+b nop
bindsym --no-repeat Control+r nop
bindsym --no-repeat Control+Shift+r nop
bindsym --no-repeat Control+w nop
bindsym --no-repeat Control+Shift+w nop
bindsym --no-repeat Control+q nop
bindsym --no-repeat Control+Shift+q nop
bindsym --no-repeat Control+Tab nop
bindsym --no-repeat Control+Shift+Tab nop
bindsym --no-repeat Control+Page_Up nop
bindsym --no-repeat Control+Shift+Page_Up nop
bindsym --no-repeat Control+Page_Down nop
bindsym --no-repeat Control+Shift+Page_Down nop
bindsym --no-repeat Control+F4 nop
bindsym --no-repeat Control+Shift+F4 nop
bindsym --no-repeat Mod1+d nop
bindsym --no-repeat Mod1+e nop
bindsym --no-repeat Mod1+f nop
bindsym --no-repeat Mod1+Home nop
bindsym --no-repeat Mod1+Left nop
bindsym --no-repeat Mod1+Right nop
bindsym --no-repeat Mod1+F4 nop
bindsym --no-repeat Mod1+space nop
bindsym --no-repeat F1 nop
bindsym --no-repeat Shift+F1 nop
bindsym --no-repeat F3 nop
bindsym --no-repeat Shift+F3 nop
bindsym --no-repeat F5 nop
bindsym --no-repeat Shift+F5 nop
bindsym --no-repeat F6 nop
bindsym --no-repeat Shift+F6 nop
bindsym --no-repeat F7 nop
bindsym --no-repeat Shift+F7 nop
bindsym --no-repeat F10 nop
bindsym --no-repeat Shift+F10 nop
bindsym --no-repeat F11 nop
bindsym --no-repeat Shift+F11 nop
bindsym --no-repeat F12 nop
bindsym --no-repeat Shift+F12 nop
bindsym --no-repeat Shift+Escape nop
bindsym --no-repeat Control+Shift+i nop
bindsym --no-repeat Control+Shift+c nop
bindsym --no-repeat Control+Shift+m nop
